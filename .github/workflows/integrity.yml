name: Artifact integrity

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Check immutable input checksums and README links
        run: python reproduce.py --check
      - name: Check release structure
        run: python -m unittest discover -s tests -v
